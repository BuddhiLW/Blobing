<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found · Dark Cyber Corner</title>
    <meta name="color-scheme" content="light dark">
    <script>
      (function(){var t;try{t=localStorage.getItem('theme')}catch(e){/* storage blocked (private mode): fall back to the OS preference below */}if(t!=='light'&&t!=='dark'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t)})();
    </script>
    <link rel="icon" type="image/png" href="/img/favicon-32.png">
    <link rel="stylesheet" href="/css/normalize.css">
    <link rel="stylesheet" href="/css/site.css">
    <style>
      .not-found { min-height: 100vh; display: grid; place-content: center; gap: 1.25rem; padding: var(--gutter); text-align: center; }
      .not-found img { width: 7rem; height: 7rem; margin: 0 auto; opacity: 0.85; }
      :root[data-theme="dark"] .not-found img { filter: invert(1); }
    </style>
  </head>
  <body>
    <main class="not-found">
      <img src="/img/black-lotus.svg" alt="">
      <h1 class="page-title">404</h1>
      <p class="lede">This corner of the cyberspace is empty.</p>
      <p><a class="button" href="/">Back home</a></p>
    </main>
  </body>
</html>
